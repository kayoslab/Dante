name: deploy

# Pushes to main: build the container image + sync Lambda bundle, push
# to ECR, apply Terraform with the new image tag. The deploy role's
# trust policy enforces that ONLY `main` workflows can assume it — a
# malicious feature branch can't deploy.
#
# Every job is additionally gated on `vars.DEPLOY_ENABLED == 'true'`:
# a repository where that variable is unset (a fork, a personal mirror,
# a fresh clone of this reference implementation) never even attempts a
# deploy. The AWS OIDC trust policy would reject it anyway, but this
# keeps the workflow from running and failing noisily — and it is an
# explicit opt-in rather than an inference from other configuration.
#
# Required GitHub *repository variables* (Settings → Secrets and
# variables → Actions → Variables). None of these are secrets, but all
# are deployment-specific, which is why they are not in the repo:
#
#   DEPLOY_ENABLED             "true" to allow this repo to deploy
#   AWS_DEPLOY_ROLE_ARN        IAM role CI assumes (output of terraform)
#   HOSTED_ZONE_ID             Route 53 zone of the parent domain
#   APP_DOMAIN                 e.g. dante.example.com
#   PARENT_DOMAIN              e.g. example.com
#   SEED_ADMIN_EMAILS          JSON list, e.g. ["admin@example.com"]
#   SYNC_LAMBDA_ALARM_EMAILS   JSON list of alarm subscribers
#   WAF_ALARM_EMAILS           JSON list of alarm subscribers
#   ECS_CLUSTER_NAME           e.g. dante-prod-app
#   ECS_SERVICE_NAME           e.g. dante-prod-app
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_terraform_apply:
        description: "Only build + push the image. Skip the Terraform step."
        required: false
        default: "false"
      skip_scan_gate:
        description: "Bypass the ECR HIGH/CRITICAL CVE gate. Use only when a fix is in progress and the finding is known-false-positive."
        required: false
        default: "false"

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.9.x
  # Flip to "true" once Inspector v2 is enabled at the account level
  # and the `aws_ecr_registry_scanning_configuration` resource in
  # terraform/envs/prod is applied. See the long-form note next to the
  # scan-gate step below for why it's off right now.
  SCAN_GATE_ENABLED: "false"

jobs:
  # ---------------------------------------------------------------------
  # Build the app container + the sync Lambda zip. Both artifacts get
  # uploaded so the deploy job can use the same blob the build step
  # produced (no rebuild = no drift between hash-and-deploy).
  # ---------------------------------------------------------------------
  build:
    name: build (container + lambda)
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.tag.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-12)
          ecr_url="${{ steps.ecr.outputs.registry }}/dante-prod-app"
          echo "tag=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image_uri=${ecr_url}:${short_sha}" >> "$GITHUB_OUTPUT"

      # Pin the QEMU binfmt emulator to a known-good version. The QEMU that
      # ships with the GitHub runner image intermittently SIGILLs (illegal
      # instruction) inside the Node build worker during the emulated arm64
      # `next build`, failing deploys with no code cause. Pinning overrides
      # the runner's QEMU with a stable one.
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Build + push container
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image_uri }}
          # Push a flat single-arch image manifest, not an OCI image
          # index. ECR's `scan_on_push` (basic scanning) only fires on
          # plain image manifests — if buildx wraps the layer in an
          # index, no scan starts and the wait-for-scan step below dies
          # with `ScanNotFoundException`.
          provenance: false
          sbom: false
          # GHA cache speeds repeat builds from ~5 min to <1 min by
          # reusing the npm + Next.js build cache between commits.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- ECR vulnerability scan gate ------------------------------
      #
      # `scan_on_push` runs an Inspector v2 scan in the background. Poll
      # until it finishes, then hard-fail the deploy if it finds any
      # CRITICAL or HIGH CVEs. Was M-008 in the pre-launch pen test —
      # the scan was enabled but had no enforcement.
      #
      # Currently disabled: ECR basic scans don't fire for arm64
      # (Fargate Graviton), and Inspector v2 requires an account
      # subscription that the AWS Free Plan blocks. Flip
      # `SCAN_GATE_ENABLED: true` (env above) once IT upgrades the
      # AWS account and the Inspector terraform stanza in
      # `terraform/envs/prod/main.tf` is un-commented + applied. To
      # bypass for one-off deploys, re-run with `inputs.skip_scan_gate`.
      - name: Wait for ECR scan + enforce severity gate
        if: env.SCAN_GATE_ENABLED == 'true' && github.event.inputs.skip_scan_gate != 'true'
        env:
          REPO_NAME: dante-prod-app
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Waiting for ECR scan on ${REPO_NAME}:${IMAGE_TAG}..."
          # Custom poll loop instead of `aws ecr wait image-scan-complete`:
          # the built-in waiter only matches the basic-scan `COMPLETE`
          # status, but we're on Inspector v2 enhanced scanning which
          # reports `ACTIVE` once findings are available (and stays
          # `ACTIVE` thereafter because Inspector continuously rescans).
          # 60 attempts × 10s = 10 minutes, plenty for a one-off scan.
          status=""
          for i in $(seq 1 60); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO_NAME" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || echo "PENDING")
            case "$status" in
              ACTIVE|COMPLETE)
                echo "Scan ready (status=$status)"
                break
                ;;
              FAILED|UNSUPPORTED_IMAGE|SCAN_ELIGIBILITY_EXPIRED|FINDINGS_UNAVAILABLE)
                echo "::error::Scan terminal-failed: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$status" != "ACTIVE" ] && [ "$status" != "COMPLETE" ]; then
            echo "::error::Scan did not complete after 10 minutes (last status: $status)"
            exit 1
          fi
          findings=$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO_NAME" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json)
          echo "Scan findings: $findings"
          critical=$(echo "$findings" | jq -r '.CRITICAL // 0')
          high=$(echo "$findings" | jq -r '.HIGH // 0')
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "::error::ECR scan found $critical CRITICAL + $high HIGH severity findings — refusing to deploy. Inspect with: aws ecr describe-image-scan-findings --repository-name $REPO_NAME --image-id imageTag=$IMAGE_TAG"
            exit 1
          fi

      # --- Sync Lambda bundle ----------------------------------------
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build Lambda bundles
        working-directory: frontend
        run: |
          npm ci
          npm run build:sync-lambda
          npm run build:cognito-pretoken-lambda

      - name: Upload sync Lambda bundle for the apply job
        uses: actions/upload-artifact@v5
        with:
          name: sync-lambda
          path: frontend/dist/lambda/dante-sync-lambda.zip
          retention-days: 7

      - name: Upload Cognito Pre Token Gen Lambda bundle for the apply job
        uses: actions/upload-artifact@v5
        with:
          name: cognito-pretoken-lambda
          path: frontend/dist/lambda-cognito-pretoken/dante-cognito-pretoken-lambda.zip
          retention-days: 7

  # ---------------------------------------------------------------------
  # Plan (auto). No mutation — generates a plan file and uploads it as
  # an artifact for the apply job to consume. The plan output is also
  # posted to the GitHub Actions step summary so the reviewer can read
  # it before clicking apply.
  # ---------------------------------------------------------------------
  terraform_plan:
    name: terraform plan (prod)
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.event.inputs.skip_terraform_apply != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download sync Lambda bundle
        uses: actions/download-artifact@v5
        with:
          name: sync-lambda
          # download-artifact's `path:` is resolved relative to
          # GITHUB_WORKSPACE, NOT to the job's working-directory. So we
          # need the workspace-relative path here even though the
          # terraform variable that points at this file is the
          # three-up `../../../frontend/dist/lambda/...` from inside
          # `terraform/envs/prod/`. Both paths land at the same file.
          path: frontend/dist/lambda

      - name: Download Cognito Pre Token Gen Lambda bundle
        uses: actions/download-artifact@v5
        with:
          name: cognito-pretoken-lambda
          path: frontend/dist/lambda-cognito-pretoken

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: |
          # Stream plan output to the job log AND tee into plan.txt.
          # set +e so the tail-into-step-summary line still runs when
          # plan exits non-zero, then propagate the original exit code.
          set +e
          terraform plan \
            -var "github_repository=${{ github.repository }}" \
            -var "hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}" \
            -var "domain=${{ vars.APP_DOMAIN }}" \
            -var "parent_domain=${{ vars.PARENT_DOMAIN }}" \
            -var 'seed_admin_emails=${{ vars.SEED_ADMIN_EMAILS }}' \
            -var 'sync_lambda_alarm_emails=${{ vars.SYNC_LAMBDA_ALARM_EMAILS }}' \
            -var 'waf_alarm_emails=${{ vars.WAF_ALARM_EMAILS }}' \
            -var "app_image_uri=${{ needs.build.outputs.image_uri }}" \
            -out=prod.tfplan \
            -no-color 2>&1 | tee plan.txt
          rc=${PIPESTATUS[0]}
          {
            echo '<details><summary>terraform plan (tail)</summary>'
            echo
            echo '```'
            tail -200 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload plan
        uses: actions/upload-artifact@v5
        with:
          name: terraform-plan
          # Only the plan binary travels via artifact. The apply job
          # re-runs `terraform init` to materialize the provider
          # plugins; the checked-in `.terraform.lock.hcl` keeps both
          # runs on the same provider versions. (upload-artifact@v4
          # silently drops dotfile paths anyway unless
          # `include-hidden-files: true` is set, so shipping the
          # ~100 MB `.terraform/` directory through artifact was
          # never going to work in v4.)
          path: terraform/envs/prod/prod.tfplan
          retention-days: 7

  # ---------------------------------------------------------------------
  # Apply (MANUAL). Gated by a GitHub Environment named `production`
  # whose Environment Protection Rule requires reviewer approval. The
  # job pauses in the GitHub UI until an authorized reviewer reads the
  # plan (in the previous job's step summary) and clicks Approve.
  #
  # Configure once in repo Settings → Environments → New Environment
  # "production" → Required reviewers: <admin team>. Without this gate,
  # a malicious commit on `main` reaches prod without human review
  # (was H-005 in the pre-launch pen test).
  # ---------------------------------------------------------------------
  terraform_apply:
    name: terraform apply (prod)
    needs: [build, terraform_plan]
    if: vars.DEPLOY_ENABLED == 'true' && github.event.inputs.skip_terraform_apply != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download sync Lambda bundle
        uses: actions/download-artifact@v5
        with:
          name: sync-lambda
          # download-artifact's `path:` is resolved relative to
          # GITHUB_WORKSPACE, NOT to the job's working-directory. So we
          # need the workspace-relative path here even though the
          # terraform variable that points at this file is the
          # three-up `../../../frontend/dist/lambda/...` from inside
          # `terraform/envs/prod/`. Both paths land at the same file.
          path: frontend/dist/lambda

      - name: Download Cognito Pre Token Gen Lambda bundle
        uses: actions/download-artifact@v5
        with:
          name: cognito-pretoken-lambda
          path: frontend/dist/lambda-cognito-pretoken

      - name: Download terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan
          path: terraform/envs/prod

      # Plan ran in a separate runner, so .terraform/ isn't cached
      # here. init reads the checked-in lock file, so the providers
      # match what the plan was built against.
      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve prod.tfplan

  # ---------------------------------------------------------------------
  # Force a new deployment so the ECS service picks up the just-updated
  # task definition revision. Terraform updates the task def + service
  # arn, but `lifecycle.ignore_changes = [task_definition]` on the
  # service means the apply doesn't roll the service itself.
  # ---------------------------------------------------------------------
  rollout:
    name: ECS rollout
    needs: [build, terraform_apply]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force-new-deployment + wait
        env:
          REPO_NAME: dante-prod-app
        run: |
          # Resolve the latest ACTIVE revision of the task def family
          # and roll the service to it. Without --task-definition,
          # --force-new-deployment just redeploys the current
          # task_definition reference — and terraform's
          # `lifecycle.ignore_changes = [task_definition]` on
          # aws_ecs_service means terraform never updates that
          # reference. Net effect of "force-new-deployment only" is
          # the new task def revision sits unused while the service
          # keeps cycling the old image.
          TD_ARN=$(aws ecs describe-task-definition \
            --task-definition "$REPO_NAME" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Rolling service to: $TD_ARN"
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --task-definition "$TD_ARN" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}"
